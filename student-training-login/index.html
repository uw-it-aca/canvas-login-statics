<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UW Student Training Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- bootstrap 5.1.3 + icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" >

    <link rel="shortcut icon" href="/img/favicon.ico" />
    <link href="/styles/main.css" rel="stylesheet" />

    <script>
      window.addEventListener("load", (event) => {
        var canvas_host,
            student_training_host,
            canvas_login,
            student_training_login;

        if (window.location.hostname.match(/^(test|beta)-/)) {
          canvas_host = "https://uw." + RegExp.$1 + ".instructure.com";
          canvas_login = document.getElementById('canvas_login');
          canvas_login.href = canvas_host;

          student_training_host = "https://uwstudenttraining." + RegExp.$1 + ".instructure.com/login/canvas";
          student_training_login = document.getElementById('student_training_login');
          student_training_login.href = student_training_host;
        }
      });
    </script>
  </head>
  <body>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="rounded-3 shadow form-studenttraining-signin p-4 pt-5" role="main">

            <!-- begin content here -->
            <div class="mt-5 text-dark">
              <h1 class="visually-hidden" id="login_header">UW Student Training Canvas Login</h1>
              <p class="h5 fw-bold mb-4">Direct access to UW Student Training Canvas is restricted</p>
              <p>UW Students: log into <a id="canvas_login" href="https://canvas.uw.edu/">UW Canvas</a> to access your training course</p>
              <p><a id="student_training_login" href="https://uwstudenttraining.instructure.com/login/canvas">Student Training Admin login</a></p>
            </div>

          </div>
        </div>
      </div>
    </div>

  </body>
</html>
